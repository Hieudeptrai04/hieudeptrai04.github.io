name: Update APT Repo

# Rebuilds each Sileo source's index FROM THE .deb FILES ALREADY IN ITS POOL.
#
# The previous version pulled releases out of the private Hieudeptrai04/HIOS-Faker
# repo. That could never work: no SRC_TOKEN secret is configured, so it fell back
# to this repo's GITHUB_TOKEN, which has no access to a different private repo —
# the API returned an error object, jq choked on it and the run died. Every push
# had been failing for weeks.
#
# Worse, had it ever succeeded it would have DELETED the current release: its
# hardcoded KEEP list was "4.0.8-fix2 4.1.0 4.2.0" and step 2 purged any pooled
# .deb outside that list, so 4.3.1 would have been wiped from Sileo within the
# 4-hourly cron.
#
# So the release-mirroring is gone. Publishing is done by pushing the .deb into
# pool/main; this job's only job is to make the index describe exactly what is
# in the pool. That is worth having on its own — a hand-written Packages once
# shipped a Filename that did not match the uploaded .deb, which is precisely
# the class of bug this catches.
#
# Two rules keep it safe:
#   * Shared metadata (Package/Name/Author/Description/Icon/Depiction/…) is
#     INHERITED from the first stanza of the existing Packages file, never
#     hardcoded here. This file therefore cannot make v3 and restore drift apart
#     or undo a contact change.
#   * It only ever adds/refreshes stanzas. It never deletes a .deb, and it
#     refuses to write an index with no packages in it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild indexes from pool
        run: |
          set -euo pipefail

          for D in v3 restore viber roothide; do
            echo "=== $D ==="
            if [ ! -d "$D/pool/main" ]; then echo "  skip: no pool"; continue; fi
            if ! ls "$D"/pool/main/*.deb >/dev/null 2>&1; then echo "  skip: no .deb in pool"; continue; fi
            if [ ! -f "$D/Packages" ]; then echo "  skip: no existing Packages to inherit metadata from"; continue; fi

            # Presentation-only fields (Icon/Depiction/Tag) are shared across the
            # source and are NOT carried in any .deb control, so inherit them from
            # the first existing stanza. Everything that identifies a package
            # (Package/Name/Version/Architecture/Section/Author/Maintainer/Depends/
            # Description) is read PER-DEB from its own control — so one source can
            # hold more than one package (e.g. com.changeinfoios.v3 AND
            # com.hiosrestore) without the second inheriting the first's identity.
            FIRST=$(sed -n '1,/^$/p' "$D/Packages")
            PRESENT=$(printf '%s\n' "$FIRST" \
                      | grep -E '^(Icon|SileoDepiction|Depiction|Tag|Homepage|Sponsor):' || true)

            : > "$D/Packages.new"
            SEP=0
            VERLIST=""
            # sort -V so Sileo lists versions in a sane order
            for DEB in $(ls "$D"/pool/main/*.deb | sort -V); do
              BN=$(basename "$DEB")
              CTRL=$(dpkg-deb -f "$DEB" 2>/dev/null || true)   # full control block
              PKG=$(printf '%s\n' "$CTRL" | sed -n 's/^Package: *//p' | head -1)
              VER=$(printf '%s\n' "$CTRL" | sed -n 's/^Version: *//p' | head -1)
              if [ -z "$PKG" ] || [ -z "$VER" ]; then echo "  !! unreadable, skipped: $BN"; continue; fi
              # NOT `[ ... ] && printf`: under `set -e` a bare AND-list that
              # evaluates false is a failing statement and kills the run on the
              # very first package.
              if [ "$SEP" -eq 1 ]; then printf '\n' >> "$D/Packages.new"; fi
              SEP=1
              # This deb's own control (drop any index-only fields), then the shared
              # presentation fields, then the computed index fields.
              CTRL_OUT=$(printf '%s\n' "$CTRL" | grep -vE '^(Filename|Size|MD5sum|SHA1|SHA256):')
              printf '%s\n' "$CTRL_OUT" >> "$D/Packages.new"
              if [ -n "$PRESENT" ]; then printf '%s\n' "$PRESENT" >> "$D/Packages.new"; fi
              printf 'Filename: pool/main/%s\n' "$BN"                             >> "$D/Packages.new"
              printf 'Size: %s\n'             "$(stat -c%s "$DEB")"               >> "$D/Packages.new"
              printf 'MD5sum: %s\n'           "$(md5sum   "$DEB" | cut -d' ' -f1)" >> "$D/Packages.new"
              printf 'SHA1: %s\n'             "$(sha1sum  "$DEB" | cut -d' ' -f1)" >> "$D/Packages.new"
              printf 'SHA256: %s\n'           "$(sha256sum "$DEB" | cut -d' ' -f1)" >> "$D/Packages.new"
              VERLIST="$VERLIST $VER"
              echo "  indexed $PKG $VER ($BN)"
            done

            # Never replace a good index with an empty one.
            if ! grep -q '^Package: ' "$D/Packages.new"; then
              echo "  !! refusing to publish an empty index"
              rm -f "$D/Packages.new"
              continue
            fi
            mv "$D/Packages.new" "$D/Packages"

            # -n omits the source filename AND mtime from the gzip header.
            # Without it every run produces different bytes for identical input,
            # so the job commits a no-op .gz change on every single push.
            gzip -9 -n -kf "$D/Packages"
            # Only .gz is served; a stale .bz2 would be an index that disagrees
            # with Packages, so make sure one can't linger.
            rm -f "$D/Packages.bz2"

            NEWEST=$(printf '%s\n' $VERLIST | sort -V | tail -1)
            if [ -f "$D/Release" ] && [ -n "$NEWEST" ]; then
              sed -i "s|^Version: .*|Version: $NEWEST|" "$D/Release"
              echo "  Release Version -> $NEWEST"

              # Rebuild Release hashes so Sileo's "Hash for Packages.gz is invalid"
              # cannot happen again. apt-ftparchive isn't on the runner — emit
              # the three sections by hand against the Packages / Packages.gz
              # we just wrote.
              SP=$(stat -c%s "$D/Packages");    MP=$(md5sum "$D/Packages"    | cut -d' ' -f1); P1=$(sha1sum "$D/Packages"    | cut -d' ' -f1); P2=$(sha256sum "$D/Packages"    | cut -d' ' -f1)
              SZ=$(stat -c%s "$D/Packages.gz"); MZ=$(md5sum "$D/Packages.gz" | cut -d' ' -f1); Z1=$(sha1sum "$D/Packages.gz" | cut -d' ' -f1); Z2=$(sha256sum "$D/Packages.gz" | cut -d' ' -f1)
              awk -v mp="$MP" -v sp="$SP" -v mz="$MZ" -v sz="$SZ" \
                  -v p1="$P1" -v z1="$Z1" -v p2="$P2" -v z2="$Z2" '
                /^MD5Sum:/  { print; print " " mp " " sp " Packages"; print " " mz " " sz " Packages.gz"; skip=1; next }
                /^SHA1:/    { print; print " " p1 " " sp " Packages"; print " " z1 " " sz " Packages.gz"; skip=1; next }
                /^SHA256:/  { print; print " " p2 " " sp " Packages"; print " " z2 " " sz " Packages.gz"; skip=1; next }
                /^[A-Za-z]/ { skip=0 }
                { if (!skip) print }
              ' "$D/Release" > "$D/Release.new" && mv "$D/Release.new" "$D/Release"
              if ! grep -q '^SHA256:' "$D/Release"; then
                printf 'SHA256:\n %s %s Packages\n %s %s Packages.gz\n' "$P2" "$SP" "$Z2" "$SZ" >> "$D/Release"
              fi
              echo "  Release hashes rebuilt"
            fi
          done

      - name: Commit if the index changed
        run: |
          set -euo pipefail
          git config user.email "actions@github.com"
          git config user.name  "GitHub Actions"
          git add -A v3 restore viber roothide
          if git diff --cached --quiet; then
            echo "Index already matches the pool — nothing to commit."
          else
            git commit -m "repo: rebuild Packages/Release from pool"
            git push
            echo "Live: https://hieudeptrai04.github.io/"
          fi
