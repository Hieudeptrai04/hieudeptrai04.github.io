name: Update APT Repo

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest v3 release and build APT repo
        env:
          # Use a PAT if set; otherwise the auto GITHUB_TOKEN so the
          # api.github.com calls are AUTHENTICATED. Anonymous calls share a
          # 60/hr IP limit and were getting rate-limited (empty response →
          # grep finds no tag → set -e aborts the run in ~90ms).
          SRC_TOKEN: ${{ secrets.SRC_TOKEN || github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/Hieudeptrai04/HIOS-Faker"
          AUTH=()
          if [ -n "${SRC_TOKEN:-}" ]; then AUTH=(-H "Authorization: token $SRC_TOKEN"); fi

          # Publish ONLY the curated KEEP set — single source of truth for what
          # appears in Sileo. Add a version to publish it; remove it to delete it.
          # (GitHub keeps every release, and /releases isn't version-sorted, so we
          # don't rely on "latest"; we explicitly list what to mirror.)
          KEEP="4.0.0-beta 4.0.1 4.0.3 4.0.4"
          RELEASES=$(curl -sL "${AUTH[@]}" "$API/releases?per_page=100")
          TAGS=$(echo "$RELEASES" | jq -r '.[].tag_name' | grep '^v3-' || true)
          if [ -z "$TAGS" ]; then
            echo "No v3 release found (private repo without SRC_TOKEN?)"; exit 1
          fi
          mkdir -p v3/pool/main
          # 1) download each KEEP version not already in the pool
          for TAG in $TAGS; do
            VER=$(echo "$TAG" | sed 's/^v3-\(.*\)-[0-9a-f]\{7,\}$/\1/')
            [ -z "$VER" ] && continue
            case " $KEEP " in *" $VER "*) ;; *) continue;; esac
            DEBFN="ChangeInfoIos-v3_${VER}_iphoneos-arm64.deb"
            [ -f "v3/pool/main/$DEBFN" ] && { echo "have $VER"; continue; }
            REL=$(curl -sL "${AUTH[@]}" "$API/releases/tags/$TAG")
            ASSET_URL=$(echo "$REL" | jq -r '.assets[] | select(.name|endswith(".deb")) | .url' | head -1)
            if [ -n "$ASSET_URL" ] && [ "$ASSET_URL" != "null" ]; then
              curl -fsSL "${AUTH[@]}" -H "Accept: application/octet-stream" "$ASSET_URL" -o "v3/pool/main/$DEBFN"
              echo "added $VER"
            fi
          done
          # 2) purge any pool deb whose version is NOT in KEEP
          for DEB in v3/pool/main/*.deb; do
            [ -f "$DEB" ] || continue
            DV=$(basename "$DEB" | sed -n 's/^ChangeInfoIos-v3_\(.*\)_iphoneos-arm64.deb$/\1/p')
            case " $KEEP " in *" $DV "*) ;; *) rm -f "$DEB"; echo "purged $DV";; esac
          done
          # newest version (by version sort) — only used for the Release file
          VERSION=$(ls v3/pool/main/ 2>/dev/null | sed -n 's/^ChangeInfoIos-v3_\(.*\)_iphoneos-arm64.deb$/\1/p' | sort -V | tail -1)

          # 4. Packages — one stanza per .deb present in the pool (multi-version).
          #    Version/Filename/Size/hashes come from each deb; the rest is shared
          #    metadata. printf only (heredocs break under YAML block indentation).
          : > v3/Packages
          for DEB in v3/pool/main/*.deb; do
            [ -f "$DEB" ] || continue
            BN=$(basename "$DEB")
            VER=$(dpkg-deb -f "$DEB" Version 2>/dev/null || true)
            [ -z "$VER" ] && VER="$VERSION"
            SIZE=$(stat -c%s "$DEB")
            MD5=$(md5sum      "$DEB" | awk '{print $1}')
            SHA1=$(sha1sum    "$DEB" | awk '{print $1}')
            SHA256=$(sha256sum "$DEB" | awk '{print $1}')
            printf '%s\n' \
              "Package: com.changeinfoios.v3" \
              "Name: HIOS Faker v3" \
              "Version: $VER" \
              "Architecture: iphoneos-arm64" \
              "Section: Tweaks" \
              "Author: houselis <https://t.me/houselis>" \
              "Maintainer: houselis <https://t.me/houselis>" \
              "Depends: ellekit | mobilesubstrate, firmware (>= 15.0)" \
              "Description: Gia mao thong tin thiet bi 22 lop cho Zalo/Facebook/TikTok/Instagram/Shopee. GPS theo IP, Keychain ephemeral, WebView JS spoof. Lien he Telegram @houselis" \
              "Icon: https://hieudeptrai04.github.io/v3/icon.png" \
              "SileoDepiction: https://hieudeptrai04.github.io/v3/depiction.json" \
              "Depiction: https://hieudeptrai04.github.io/v3/depiction.html" \
              "Tag: purpose::extension, compatible::dopamine" \
              "Filename: pool/main/$BN" \
              "Size: $SIZE" \
              "MD5sum: $MD5" \
              "SHA1: $SHA1" \
              "SHA256: $SHA256" \
              "" >> v3/Packages
          done
          bzip2 -kf v3/Packages
          gzip  -kf v3/Packages

          # 5. Release — Version reflects the newest published version.
          printf '%s\n' \
            "Origin: HIOS Faker" \
            "Label: HIOS Faker v3" \
            "Suite: stable" \
            "Version: $VERSION" \
            "Codename: ios" \
            "Architectures: iphoneos-arm64" \
            "Components: main" \
            "Description: HIOS Faker v3 - Deep device spoof. Telegram @houselis" > v3/Release

          echo "$TAG" > v3/VERSION

          # 6. Commit only if something changed (no early-exit, so script
          #    edits always re-apply; empty-diff guard prevents noise commits)
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A v3/
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "repo: v3 $VERSION ($TAG) — keep all versions"
            git push
            echo "Live: https://hieudeptrai04.github.io/v3/"
          fi

# multi-version repo: new releases ADD a version, never replace 3.3.5
